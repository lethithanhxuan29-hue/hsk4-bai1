<!DOCTYPE html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 1 – Tiếng Trung Nhật Minh</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f5f8;color:#19364c;font:17px/1.65 Arial,"Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:24px}header,section{background:white;padding:24px;border-radius:16px;margin-bottom:20px}h1{font-size:28px;margin:0}h2{font-size:23px}small{color:#526b7b}input,textarea{width:100%;font:inherit;padding:12px;border:1px solid #b8cbd7;border-radius:8px;background:#fcfefe}textarea{min-height:78px;resize:vertical}.question{border-top:1px solid #e2ebef;padding:18px 0}.question label{display:block;margin-bottom:10px}.bank{background:#e7f4ef;padding:16px;border-radius:8px;position:sticky;top:0}.answer{background:#eef7f2;padding:12px;margin-top:10px}.correct{border-color:#20855d}.incorrect{border-color:#c94747}button{font:inherit;padding:11px 19px;margin:5px;border:0;border-radius:8px;background:#175c7b;color:white;cursor:pointer}button.secondary{background:#526b7b}.actions{position:sticky;bottom:0;background:#ffffffed;padding:12px;border-top:1px solid #ccdce5}progress{width:100%;height:15px}#result{padding:15px;background:#e9f4f9;border-radius:8px;margin:10px 0}nav a{display:inline-block;margin:6px;color:#175c7b} @media(max-width:600px){main{padding:10px}header,section{padding:16px}h1{font-size:24px}.bank{position:static}}@media print{body{background:white}.actions,nav,progress,button{display:none}section{break-inside:auto}.question{break-inside:avoid}textarea{min-height:65px}}</style><main><header><small>TIẾNG TRUNG NHẬT MINH</small><h1>Lesson 1 · Bài tập ôn tập</h1><p>15 câu điền từ · 10 câu sắp xếp · 6 câu Trung–Việt · 6 câu Việt–Trung</p><label for="name">Họ tên học viên</label><input id="name" placeholder="Nhập họ tên"><nav><a href="#part0">Điền từ</a><a href="#part1">Sắp xếp</a><a href="#part2">Trung–Việt</a><a href="#part3">Việt–Trung</a></nav><p id="status"></p><progress id="progress" max="37" value="0"></progress><small>Bài làm tự lưu trên trình duyệt này. Điền từ được chấm tự động. Câu sắp xếp và dịch do giáo viên kiểm tra theo đáp án tham khảo.</small></header><div id="content"></div><div class="actions"><button id="submit">Nộp bài</button><button id="download" class="secondary">Tải bài làm gửi cô</button><button id="reset" class="secondary">Làm lại</button><div id="result" hidden aria-live="polite"></div></div></main><script>const sections=[{"title": "I. Điền từ vào chỗ trống", "hint": "Mỗi từ chỉ dùng một lần.", "bank": "签证、入学、通知、证件、材料、任何、食堂、申请、奖学金、获得、减轻、压力、课程、交流、适应", "items": [["去中国留学以前，你需要办理____。", "签证"], ["今天是新生办理____手续的日子。", "入学"], ["学校已经发出____，明天上午八点开会。", "通知"], ["护照是一种重要的____，一定要保管好。", "证件"], ["申请奖学金需要准备哪些____？", "材料"], ["上课的时候，____人都不能大声说话。", "任何"], ["中午我们一起去____吃饭吧。", "食堂"], ["我想____这所大学的研究生。", "申请"], ["她学习很努力，希望能拿到____。", "奖学金"], ["他在比赛中表现很好，____了第一名。", "获得"], ["这笔奖学金可以____家里的经济压力。", "减轻"], ["最近考试很多，我觉得____很大。", "压力"], ["这个学期，我们有五门____。", "课程"], ["参加学校的活动，可以增加与同学____的机会。", "交流"], ["刚来中国的时候，我不太____这里的生活。", "适应"]]}, {"title": "II. Sắp xếp câu", "hint": "Sử dụng tất cả các từ hoặc cụm từ đã cho.", "items": [["已经 / 我 / 办好了 / 签证", "我已经办好了签证。"], ["这些 / 请 / 准备好 / 材料", "请准备好这些材料。"], ["一座 / 学校里 / 新的 / 有 / 食堂", "学校里有一座新的食堂。"], ["申请 / 她 / 奖学金 / 想", "她想申请奖学金。"], ["很好 / 今天 / 他的 / 表现", "他今天的表现很好。"], ["一名 / 将来 / 我 / 教师 / 想 / 成为", "将来我想成为一名教师。"], ["中国文化 / 正在 / 他 / 研究", "他正在研究中国文化。"], ["学校的 / 参加 / 我 / 活动 / 喜欢", "我喜欢参加学校的活动。"], ["通过 / 我 / 交流 / 学到了 / 与同学 / 很多知识", "通过与同学交流，我学到了很多知识。"], ["学好 / 要是 / 汉语 / 你想 / 就 / 要 / 多练习", "要是你想学好汉语，就要多练习。"]]}, {"title": "III. Dịch Trung → Việt", "hint": "Viết bản dịch tiếng Việt của mỗi câu.", "items": [["请带上护照和其他证件，来学校办理入学手续。", "Hãy mang theo hộ chiếu và các giấy tờ khác đến trường làm thủ tục nhập học."], ["要是你获得了奖学金，就可以减轻家里的经济压力。", "Nếu bạn nhận được học bổng thì có thể giảm bớt áp lực tài chính cho gia đình."], ["我的专业是国际贸易，将来我想在一家国际公司工作。", "Chuyên ngành của tôi là thương mại quốc tế, sau này tôi muốn làm việc tại một công ty quốc tế."], ["随着课程越来越多，我的学习压力也越来越大。", "Cùng với việc các môn học ngày càng nhiều, áp lực học tập của tôi cũng ngày càng lớn."], ["通过参加学校的活动，我认识了很多朋友，也学到了很多新知识。", "Thông qua việc tham gia các hoạt động của trường, tôi đã làm quen với nhiều bạn và học được nhiều kiến thức mới."], ["他本科毕业以后，想继续读研究生，将来成为一名教师。", "Sau khi tốt nghiệp đại học, anh ấy muốn tiếp tục học sau đại học và sau này trở thành một giáo viên."]]}, {"title": "IV. Dịch Việt → Trung", "hint": "Viết bản dịch tiếng Trung của mỗi câu.", "items": [["Tôi muốn xin học bổng của trường đại học này.", "我想申请这所大学的奖学金。"], ["Nhà ăn của trường là một tòa nhà rất lớn.", "学校的食堂是一座很大的楼。"], ["Cô ấy đang nghiên cứu những vấn đề về phương diện giáo dục.", "她正在研究教育方面的问题。"], ["Ngày mai chúng ta xuất phát lúc tám giờ, bất kỳ ai cũng không được đến muộn.", "明天我们八点出发，任何人都不能迟到。"], ["Tôi đã thích nghi với cuộc sống ở đây, nhưng tôi vẫn muốn giao lưu nhiều hơn với các bạn học.", "我已经适应了这里的生活，但是我还想多跟同学交流。"], ["Thầy Vương là tiến sĩ, một giáo viên khác là thạc sĩ.", "王老师是博士，另一位教师是硕士。"]]}];
const key='nhatminh_lesson1_37_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const content=document.getElementById('content');sections.forEach((s,k)=>{const sec=document.createElement('section');sec.id='part'+k;const h=document.createElement('h2');h.textContent=s.title;sec.append(h);const hint=document.createElement('p');hint.textContent=s.hint;sec.append(hint);if(s.bank){const bank=document.createElement('div');bank.className='bank';bank.textContent=s.bank;sec.append(bank)}s.items.forEach(([q,a],i)=>{const div=document.createElement('div');div.className='question';const id='q'+k+'_'+i;const label=document.createElement('label');label.htmlFor=id;label.textContent=(i+1)+'. '+q;const input=document.createElement(k===0?'input':'textarea');input.id=id;input.value=saved[id]||'';input.autocomplete='off';input.addEventListener('input',()=>{save();document.getElementById('result').hidden=true;document.querySelectorAll('.answer').forEach(x=>x.hidden=true);document.querySelectorAll('.correct,.incorrect').forEach(x=>x.classList.remove('correct','incorrect'))});const ans=document.createElement('div');ans.className='answer';ans.hidden=true;ans.textContent=(k===0?'Đáp án: ':'Tham khảo: ')+a;div.append(label,input,ans);sec.append(div)});content.append(sec)});const name=document.getElementById('name');name.value=saved.name||'';name.oninput=save;function collect(){const obj={name:name.value};document.querySelectorAll('.question input,.question textarea').forEach(x=>obj[x.id]=x.value);return obj}function save(){try{localStorage.setItem(key,JSON.stringify(collect()))}catch(e){}update()}function update(){const done=[...document.querySelectorAll('.question input,.question textarea')].filter(x=>x.value.trim()).length;document.getElementById('status').textContent='Đã làm '+done+'/37 câu';document.getElementById('progress').value=done}const norm=x=>x.replace(/[\s。，！？、,.!?]/g,'');function grade(){let n=0;sections[0].items.forEach(([q,a],i)=>{const el=document.getElementById('q0_'+i),ok=norm(el.value)===norm(a);el.classList.toggle('correct',ok);el.classList.toggle('incorrect',!ok);if(ok)n++});return n}document.getElementById('submit').onclick=()=>{save();const n=grade();document.querySelectorAll('.answer').forEach(x=>x.hidden=false);const r=document.getElementById('result');r.hidden=false;r.textContent='Kết quả phần điền từ: '+n+'/15 câu đúng. 22 câu sắp xếp và dịch: gửi giáo viên kiểm tra. Đáp án tham khảo đã hiện dưới từng câu.'};document.getElementById('reset').onclick=()=>{if(!confirm('Xóa toàn bộ bài làm và bắt đầu lại?'))return;document.querySelectorAll('input,textarea').forEach(x=>x.value='');document.querySelectorAll('.answer').forEach(x=>x.hidden=true);document.querySelectorAll('.correct,.incorrect').forEach(x=>x.classList.remove('correct','incorrect'));document.getElementById('result').hidden=true;save()};document.getElementById('download').onclick=()=>{let txt='TIẾNG TRUNG NHẬT MINH – LESSON 1\nHọc viên: '+name.value+'\nThời gian: '+new Date().toLocaleString('vi-VN')+'\nĐiền từ: '+grade()+'/15\nCác phần còn lại: giáo viên kiểm tra\n';sections.forEach((s,k)=>{txt+='\n'+s.title+'\n';s.items.forEach(([q,a],i)=>txt+=(i+1)+'. '+q+'\nBài làm: '+document.getElementById('q'+k+'_'+i).value+'\n')});const blob=new Blob(['\ufeff'+txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='Lesson1_BaiLam.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};update();</script></html>
